<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SSCS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/admin.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>

    <!-- NAV -->
    <nav>
        <div class="nav-inner nav-inner--dashboard">
            <a href="../index.html" class="logo">
                <div class="logo-mark">SS</div>
                <div class="logo-text">
                    <strong>SSCS</strong>
                    <span>Admin Dashboard</span>
                </div>
            </a>
            <div class="nav-right">
                <span class="nav-user" id="navUser">Welcome back</span>
                <button class="btn-logout" id="logoutBtn">
                    <!-- Heroicons: arrow-right-on-rectangle -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="dashboard">
        <div class="dashboard-inner">

            <!-- Header -->
            <div class="dashboard-header">
                <div>
                    <p class="section-label">Analytics</p>
                    <h1 class="dashboard-title">Complaints Report</h1>
                </div>
                <div class="dashboard-date" id="dashboardDate"></div>
            </div>

            <!-- Top KPI Cards -->
            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-card-info">
                        <span class="stat-card-label">Total Complaints</span>
                        <span class="stat-card-value" id="statTotal">—</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-info">
                        <span class="stat-card-label">Anonymous</span>
                        <span class="stat-card-value" id="statAnonymous">—</span>
                        <span class="stat-card-sub" id="statAnonymousPct">—</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-info">
                        <span class="stat-card-label">Follow-up Requested</span>
                        <span class="stat-card-value" id="statFollowUp">—</span>
                        <span class="stat-card-sub" id="statFollowUpPct">—</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-info">
                        <span class="stat-card-label">High Priority</span>
                        <span class="stat-card-value" id="statHigh">—</span>
                    </div>
                </div>

            </div>

            <!-- REPORT SECTIONS -->
            <div class="analytics-grid">

                <!-- Facility -->
                <div class="card">
                    <h3>By Health Facility</h3>
                    <canvas id="facilityChart"></canvas>
                </div>

                <!-- Category -->
                <div class="card">
                    <h3>By Category</h3>
                    <canvas id="categoryChart"></canvas>
                </div>

                <!-- Priority -->
                <div class="card">
                    <h3>By Priority</h3>
                    <canvas id="priorityChart"></canvas>
                </div>

                <!-- Time -->
                <div class="card">
                    <h3>Complaints by Month</h3>
                    <canvas id="monthChart"></canvas>
                </div>

            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../scripts/admin.js"></script>
    <script src="../scripts/dashboard.js"></script>
</body>

</html>
